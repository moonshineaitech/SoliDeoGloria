[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cab-benchmark"
version = "3.0.0"
description = "Christian AI Benchmark (CAB) - v2 base + v3 'Flourishing & Faithfulness' (CAB-FF) for evaluating AI alignment with Christian faith"
readme = "README.md"
license = {text = "CC-BY-SA-4.0"}
requires-python = ">=3.9"
authors = [
    {name = "GoldRock AI", email = "research@solideogloria.ai"}
]
keywords = [
    "benchmark",
    "ai",
    "christianity",
    "theology",
    "evaluation",
    "llm"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Creative Commons Attribution-ShareAlike 4.0",
]

# Minimal core deps. Provider SDKs are optional — only required if you
# use that specific provider. See [project.optional-dependencies].
dependencies = [
    "click>=8.0.0",
    "jsonschema>=4.0.0",
    "tqdm>=4.62.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.18.0"]
openai = ["openai>=1.0.0"]
litellm = ["litellm>=1.0.0"]
all-providers = ["anthropic>=0.18.0", "openai>=1.0.0", "litellm>=1.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
]
viz = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]

[project.urls]
Homepage = "https://SoliDeoGloria.ai"
Repository = "https://github.com/moonshineaitech/SoliDeoGloria"
Documentation = "https://github.com/moonshineaitech/SoliDeoGloria/tree/main/docs"
Issues = "https://github.com/moonshineaitech/SoliDeoGloria/issues"

[project.scripts]
cab-evaluate = "cab_benchmark.cli:main"
cab-ff = "cab_ff.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cab_benchmark*", "cab_ff*"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
