name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Validate dataset
        run: python -m cab_ff.cli validate data/CAB_FF_v3_dataset.json
      - name: Run tests
        run: pytest -q tests/
      - name: Run quickstart smoke
        run: python examples/quickstart.py --objective 5

  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Rebuild dataset and check unchanged
        run: |
          python scripts/build_dataset.py
          git diff --exit-code data/CAB_FF_v3_dataset.json || {
            echo "::error::Dataset is stale. Run 'python scripts/build_dataset.py' and commit." >&2
            exit 1
          }
