# SFT config — Qwen3.5-4B (edge / phone / Ollama-on-laptop target)
# License: Apache 2.0
# HF: Qwen/Qwen3.5-4B
#
# Target hardware: 1× 16GB GPU (RTX 4060 Ti 16GB / RTX 5060 / Colab T4 high RAM)
#                  Or even a Mac M-series with MLX (not covered here).

model:
  base_model: Qwen/Qwen3.5-4B
  trust_remote_code: true
  attn_implementation: flash_attention_2
  torch_dtype: bfloat16

# Full BF16 (no 4-bit needed at 4B)
quantization:
  load_in_4bit: false

lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  output_dir: outputs/sdg-4b-sft
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 3.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  optim: adamw_torch_fused
  bf16: true
  tf32: true
  max_seq_length: 4096
  packing: true
  logging_steps: 5
  save_steps: 500
  save_total_limit: 2
  eval_steps: 250
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  seed: 17

liger_kernel:
  enabled: true
  cross_entropy: true
  fused_linear_cross_entropy: true

data:
  train_file: train.jsonl
  eval_file: eval.jsonl
  chat_template: tokenizer_default

data_mix:
  cab_ff_synth_sft: 0.50
  multi_turn_pushback: 0.10
  tulu3_general: 0.25
  christian_corpus_qa: 0.15

output:
  save_adapter: true
  save_merged: true
  save_tokenizer: true
