# SFT config — Gemma 4 E4B (effective 4B, multimodal, on-device target)
# License: Apache 2.0
# HF: google/gemma-4-e4b
# Released: April 2, 2026
#
# E4B is the "effective 4B" variant — high-capacity architecture compressed
# to ~4B effective parameters. Multimodal native (text + image + 30s audio).
# Perfect for: on-device deployment, Ollama-on-laptop, phone apps, ministry
# apps with offline mode, edge devices.
#
# Target hardware: 1× 16GB GPU (RTX 4060 Ti 16GB / 5060 / Colab T4 high
# RAM), or Mac M-series via MLX. CPU-only training is borderline feasible
# overnight for small data.

model:
  base_model: google/gemma-4-e4b
  trust_remote_code: false
  attn_implementation: flash_attention_2
  torch_dtype: bfloat16

# At 4B effective, full-precision is fine; no 4-bit quantization needed.
quantization:
  load_in_4bit: false

peft:
  method: dora
  r: 64                                     # smaller rank for smaller model
  alpha: 128
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

neftune:
  enabled: true
  alpha: 5.0

training:
  output_dir: outputs/sdg-e4b-sft
  num_train_epochs: 3                       # smaller models benefit from more epochs
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 3.0e-4                     # higher LR for smaller model
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  optim: adamw_torch_fused
  bf16: true
  tf32: true
  max_seq_length: 4096
  packing: true
  logging_steps: 5
  save_steps: 500
  save_total_limit: 2
  eval_steps: 250
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  seed: 17
  cab_ff_inline_eval: true
  cab_ff_eval_every_steps: 250
  cab_ff_eval_subset_size: 30
  cab_ff_early_stop_if_dim_drops: 5

liger_kernel:
  enabled: true
  cross_entropy: true
  fused_linear_cross_entropy: true

data:
  train_file: train.jsonl
  eval_file: eval.jsonl
  chat_template: tokenizer_default
  curriculum: by_difficulty

data_mix:
  # E4B benefits from more Christian-specific data and slightly less
  # general data — the base is small so we don't need to preserve as
  # much general capability.
  cab_ff_synth_sft: 0.50
  multi_turn_pushback: 0.10
  tulu3_general: 0.25
  christian_corpus_qa: 0.15

output:
  save_adapter: true
  save_merged: true
  save_tokenizer: true
