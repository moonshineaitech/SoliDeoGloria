# SFT config — GLM-5.1 (Z.ai, frontier agentic MoE)
# License: MIT
# HF: zai-org/GLM-5.1
# Released: April 7, 2026
# 744B total / ~40B active per token, 200K context
#
# When to pick: agentic / long-horizon engineering and pastoral
# scenarios. GLM-5.1 leads on GDPval-AA (agentic real-world work) at
# 1535 vs DeepSeek V4-Pro at 1554.
#
# WARNING: 744B MoE. Realistic minimum: 8× H100 80GB with DeepSpeed
# ZeRO-3 + attention-only LoRA. 16× H100 strongly recommended for
# reasonable wall times.

model:
  base_model: zai-org/GLM-5.1
  trust_remote_code: true
  attn_implementation: flash_attention_2
  torch_dtype: bfloat16

# MoE LoRA: attention-only. Targeting MLP experts would replicate the
# adapter per expert per layer — explodes the trainable parameter count.
peft:
  method: dora
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]   # ATTENTION ONLY
  modules_to_save: []

neftune:
  enabled: true
  alpha: 5.0

distributed:
  strategy: deepspeed
  zero_stage: 3
  offload_optimizer: cpu
  offload_param: none
  gradient_clipping: 1.0
  config_file: configs/deepspeed/zero3_8xh100.json

training:
  output_dir: outputs/sdg-glm51-sft
  num_train_epochs: 1                       # 1 epoch enough for a 744B base
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  learning_rate: 5.0e-5                     # very low for frontier model
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  optim: adamw_bnb_8bit
  bf16: true
  tf32: true
  max_seq_length: 8192
  packing: true
  logging_steps: 5
  save_steps: 250
  save_total_limit: 2
  eval_steps: 250
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  seed: 17
  cab_ff_inline_eval: false                 # too expensive at this scale

liger_kernel:
  enabled: true
  cross_entropy: true
  fused_linear_cross_entropy: true

data:
  train_file: train.jsonl
  eval_file: eval.jsonl
  chat_template: tokenizer_default
  curriculum: by_difficulty

data_mix:
  cab_ff_synth_sft: 0.40
  multi_turn_pushback: 0.15
  tulu3_general: 0.25
  christian_corpus_qa: 0.20

output:
  save_adapter: true
  save_merged: false                        # too big; serve via vLLM + adapter
  save_tokenizer: true
