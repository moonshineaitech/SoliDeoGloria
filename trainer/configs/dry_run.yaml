# Dry-run config — verifies the whole pipeline on tiny synth data, no GPU.
# Used by `make dry-run`. Trains one tiny model for one step to prove
# all wiring is correct.

model:
  base_model: sshleifer/tiny-gpt2      # 80KB, runs on CPU in seconds
  trust_remote_code: false
  attn_implementation: eager
  torch_dtype: float32

lora:
  enabled: false                       # tiny model — full fine-tune is fine

training:
  output_dir: outputs/dry-run
  num_train_epochs: 1
  max_steps: 5                         # 5 steps total
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  lr_scheduler_type: constant
  warmup_steps: 0
  optim: adamw_torch
  bf16: false
  tf32: false
  fp16: false
  max_seq_length: 256
  packing: false
  logging_steps: 1
  save_strategy: "no"
  eval_strategy: "no"
  report_to: []
  seed: 17

liger_kernel:
  enabled: false

data:
  train_file: train.jsonl
  eval_file: eval.jsonl
  chat_template: tokenizer_default

data_mix: {}                           # dry-run uses what's in train.jsonl as-is

output:
  save_adapter: false
  save_merged: false
  save_tokenizer: false
